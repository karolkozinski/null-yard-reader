name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Name build
        id: meta
        run: |
          STAMP=$(TZ=Europe/Warsaw date +%Y-%m-%d_%H%M)
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "NULL_READER_${STAMP}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: null-reader-${{ steps.meta.outputs.stamp }}
          path: NULL_READER_${{ steps.meta.outputs.stamp }}.apk
          if-no-files-found: error
          retention-days: 7
